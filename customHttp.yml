# Custom response headers for AWS Amplify Hosting.
# Amplify reads this file from the repo root on each build. The same YAML can also be pasted
# into Amplify console > Hosting > Custom headers.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      # script-src and style-src are enforced by the per-page CSP <meta> that Astro generates with
      # hashes (security.csp in astro.config.mjs). Directives that only work as a header live here.
      - key: Content-Security-Policy
        value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"
  # Fingerprinted build assets never change, so cache them for a year.
  - pattern: '/_astro/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # HTML must revalidate so new deploys show up immediately.
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
