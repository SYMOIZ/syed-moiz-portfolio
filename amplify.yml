# AWS Amplify Hosting build specification.
# Amplify detects this file in the repo root and uses it instead of the console build settings.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Astro 7 requires Node >= 22.23.4; install the latest Node 22 LTS on the build image.
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
        # Fail the deploy on placeholder or unconfirmed links, or anything that looks like a secret.
        - npm run check:content
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
